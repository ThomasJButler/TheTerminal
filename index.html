<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020503" />
    <title>Tom Butler | TJB-100</title>
    <meta name="description" content="Junior AI Agent Developer. A terminal with everything in it, if you go looking." />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!--head-->
    <script>
      // Decide before first paint whether this visit opens on the machine or on the screen.
      // Only a cold visit to the front door gets the machine, and never against a
      // reduced-motion preference. If the app has not mounted in four seconds, show the
      // terminal anyway: the page must never depend on the scene to be readable.
      (function () {
        try {
          var root = document.documentElement;
          var home = location.pathname.replace(/\/$/, '') === '%BASE_URL%'.replace(/\/$/, '');
          var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
          var gl = !!document.createElement('canvas').getContext('webgl2');
          if (home && !still && gl && !sessionStorage.getItem('tjb100.seen')) {
            root.dataset.boot = 'intro';
            setTimeout(function () {
              if (!window.__tjbMounted) delete root.dataset.boot;
            }, 4000);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
